name: Test

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to check out (empty uses the workflow default)."
        required: false
        type: string
        default: ""
      runner:
        description: "GitHub runner OS label (e.g. ubuntu-22.04)."
        required: true
        type: string
      platform:
        description: "Logical platform name (linux, windows, macos)."
        required: true
        type: string
      architecture:
        description: "Python interpreter architecture (x64 or arm64)."
        required: true
        type: string

permissions:
  contents: read

env:
  QT_QPA_PLATFORM: offscreen
  PYTHONUTF8: "1"

jobs:
  test:
    name: Test (${{ inputs.platform }})
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          architecture: ${{ inputs.architecture }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Configure project temp directory
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/workdir/tmp"
          echo "TMPDIR=$GITHUB_WORKSPACE/workdir/tmp" >> "$GITHUB_ENV"
          echo "TMP=$GITHUB_WORKSPACE/workdir/tmp" >> "$GITHUB_ENV"
          echo "TEMP=$GITHUB_WORKSPACE/workdir/tmp" >> "$GITHUB_ENV"

      - name: Install Linux Qt runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libpulse0 \
            libpulse-mainloop-glib0 \
            libxkbcommon-x11-0 \
            libxcb-cursor0

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Verify generated icon assets
        run: python scripts/build_icons.py --check

      - name: Compile Python sources
        run: python -m compileall -q main.py cli core gui scripts test

      - name: Check CLI help
        run: python main.py --cli --help

      - name: Run unit tests
        run: python -m scripts.run_tests discover -s test -p "test_*.py" -v
