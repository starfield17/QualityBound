name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  QT_QPA_PLATFORM: offscreen
  PYTHONUTF8: "1"

jobs:
  quality:
    name: Quality
    uses: ./.github/workflows/_quality.yml
    with:
      ref: ${{ github.ref }}

  matrix_plan:
    name: Release matrix plan
    runs-on: ubuntu-22.04
    outputs:
      test_matrix: ${{ steps.matrix.outputs.test_matrix }}
      package_matrix: ${{ steps.matrix.outputs.package_matrix }}
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Generate canonical release matrices
        id: matrix
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os

          from scripts.ci_plan import PACKAGE_TARGETS, TEST_TARGETS

          values = {
              "test_matrix": list(TEST_TARGETS.values()),
              "package_matrix": list(PACKAGE_TARGETS.values()),
          }
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              for name, value in values.items():
                  encoded = json.dumps(value, separators=(",", ":"))
                  output.write(f"{name}={encoded}\n")
          PY

  tests:
    name: Tests
    needs: [quality, matrix_plan]
    if: needs.quality.result == 'success' && needs.matrix_plan.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix_plan.outputs.test_matrix) }}
    uses: ./.github/workflows/_test.yml
    with:
      ref: ${{ github.ref }}
      runner: ${{ matrix.runner }}
      platform: ${{ matrix.platform }}
      architecture: ${{ matrix.architecture }}

  installer:
    name: Windows Installer Contract
    needs: quality
    if: needs.quality.result == 'success'
    uses: ./.github/workflows/_windows-installer-contract.yml
    with:
      ref: ${{ github.ref }}
      version: ${{ github.ref_name }}

  preflight:
    name: Preflight
    needs: [quality, tests, installer]
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - name: Require quality, all three OS tests, and installer contract
        shell: bash
        run: |
          for status in \
              "${{ needs.quality.result }}" \
              "${{ needs.tests.result }}" \
              "${{ needs.installer.result }}"; do
              if [ "$status" = "failure" ] || [ "$status" = "cancelled" ] || [ "$status" = "skipped" ]; then
                  echo "Preflight prerequisite failed: $status" >&2
                  exit 1
              fi
          done
          exit 0

  build:
    name: Build (${{ matrix.target }})
    needs: [preflight, matrix_plan]
    if: needs.preflight.result == 'success' && needs.matrix_plan.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix_plan.outputs.package_matrix) }}
    uses: ./.github/workflows/_package.yml
    with:
      ref: ${{ github.ref }}
      version: ${{ github.ref_name }}
      target: ${{ matrix.target }}
      runner: ${{ matrix.runner }}
      architecture: ${{ matrix.architecture }}
      package_kind: ${{ matrix.package_kind }}
      windows_compiler: ${{ matrix.windows_compiler }}
      installer_architecture: ${{ matrix.installer_architecture }}
      target_arch: ${{ matrix.target_arch }}
      mode: release
    secrets: inherit

  publish:
    name: Publish GitHub Release
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-package-*
          path: packages
          merge-multiple: true

      - name: Validate release packages and generate checksums
        shell: bash
        run: |
          shopt -s nullglob
          archives=(
            packages/*.zip
            packages/*.tar.gz
            packages/*.dmg
            packages/*-setup.exe
          )

          if [[ "${#archives[@]}" -ne 8 ]]; then
              printf 'Expected 8 release packages, found %s\n' \
                "${#archives[@]}" >&2
              printf '%s\n' "${archives[@]}" >&2
              exit 1
          fi

          release="$GITHUB_REF_NAME"
          expected=(
            "qualitybound-${release}-windows-x86_64.zip"
            "qualitybound-${release}-windows-x86_64-setup.exe"
            "qualitybound-${release}-windows-arm64.zip"
            "qualitybound-${release}-windows-arm64-setup.exe"
            "qualitybound-${release}-linux-x86_64.tar.gz"
            "qualitybound-${release}-linux-arm64.tar.gz"
            "qualitybound-${release}-macos-arm64.tar.gz"
            "qualitybound-${release}-macos-arm64.dmg"
          )

          declare -A expected_set=()
          for name in "${expected[@]}"; do
              expected_set["$name"]=1
          done

          declare -A seen_names=()
          for archive in "${archives[@]}"; do
              name="$(basename "$archive")"
              if [[ -n "${seen_names[$name]+x}" ]]; then
                  printf 'Duplicate package filename: %s\n' "$name" >&2
                  exit 1
              fi
              seen_names["$name"]=1
              if [[ -z "${expected_set[$name]+x}" ]]; then
                  printf 'Unexpected package filename: %s\n' "$name" >&2
                  exit 1
              fi
              if [[ ! -s "$archive" ]]; then
                  printf 'Empty package: %s\n' "$archive" >&2
                  exit 1
              fi
          done

          for name in "${expected[@]}"; do
              if [[ ! -s "packages/$name" ]]; then
                  printf 'Missing expected package: %s\n' "$name" >&2
                  exit 1
              fi
          done

          (
            cd packages
            sha256sum *.zip *.tar.gz *.dmg *-setup.exe > SHA256SUMS.txt
          )

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release upload "$GITHUB_REF_NAME" packages/* --clobber --repo "$GITHUB_REPOSITORY"
          else
              gh release create "$GITHUB_REF_NAME" packages/* \
                --generate-notes \
                --title "$GITHUB_REF_NAME" \
                --repo "$GITHUB_REPOSITORY"
          fi
