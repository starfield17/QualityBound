name: Quality

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to check out (empty uses the workflow default)."
        required: false
        type: string
        default: ""

permissions:
  contents: read

env:
  QT_QPA_PLATFORM: offscreen
  PYTHONUTF8: "1"

jobs:
  quality:
    name: Architecture, lint, and types
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Linux Qt runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check module boundaries
        run: python -m unittest discover -s test -p "test_architecture.py" -v

      - name: Check Windows Setup command contract
        run: python -m unittest discover -s test -p "test_windows_setup.py" -v

      - name: Check workflow contract
        run: python -m unittest discover -s test -p "test_release_workflows.py" -v

      - name: Check CI planner contract
        run: python -m unittest discover -s test -p "test_ci_plan.py" -v

      - name: Verify generated icon assets
        run: python scripts/build_icons.py --check

      - name: Compile Python sources
        run: python -m compileall -q main.py cli core gui scripts test

      - name: Lint Python sources
        run: ruff check .

      - name: Type-check core and CLI
        run: pyright

      - name: Type-check the test suite
        run: pyright -p pyright.tests.json

      - name: Type-check the development scripts
        run: pyright -p pyright.scripts.json

      - name: Ratchet strict-mode inference debt
        run: python scripts/check_strict_debt.py
