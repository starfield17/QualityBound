[tool.ruff]
target-version = "py313"
line-length = 120
exclude = ["FFmpeg", "build", "dist", "workdir"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "basic"
include = ["core", "cli", "gui", "main.py"]
exclude = ["build", "dist", "workdir", "translations"]
